version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/mikrotik_manager.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DEVICE_CREDENTIAL_KEY=${DEVICE_CREDENTIAL_KEY:-change-this-encryption-key-32b!}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80"]
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
